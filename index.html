<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Opening Repertoire Trainer</title>

    <!-- Vendor libraries (local) -->
    <script src="vendor/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="vendor/chessboard-1.0.0.min.css">
    <script src="vendor/chessboard-1.0.0.min.js"></script>
    <script src="vendor/chess.min.js"></script>

    <!-- App styles -->
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ==================== HEADER ==================== -->
<header class="app-header">
    <div class="app-title" id="btn-home">
        <span class="icon">&#9822;</span>
        <span class="app-title-text">Repertoire Trainer</span>
    </div>
    <nav class="header-nav" id="header-breadcrumb"></nav>
    <div class="header-actions">
        <button class="btn btn-icon btn-sound" id="btn-sound" title="Toggle sounds (M)">&#9835;</button>
        <button class="btn btn-icon" id="btn-backup" title="Backup all data">&#128190;</button>
        <button class="btn btn-sm btn-secondary" id="btn-import">Import PGN</button>
        <button class="btn btn-sm btn-primary" id="btn-new-repertoire">+ New</button>
    </div>
</header>

<main class="app-content">

    <!-- ==================== HOME VIEW ==================== -->
    <div class="view-full active" id="view-home">
        <div class="home-header">
            <h2>My Repertoires</h2>
        </div>
        <div class="home-actions-row">
            <label class="btn btn-sm btn-secondary btn-restore" title="Restore from backup">
                &#128194; Restore Backup
                <input type="file" id="restore-file" accept=".json" style="display:none">
            </label>
            <span id="home-storage-info" class="text-muted" style="font-size: 0.8rem;"></span>
        </div>
        <div id="restore-status" style="display:none"></div>
        <div id="repertoire-list">
            <div class="empty-state">
                <div class="empty-icon">&#9822;</div>
                <p>No repertoires yet.</p>
                <p>Import a PGN file or create a new repertoire to get started.</p>
            </div>
        </div>
    </div>

    <!-- ==================== IMPORT VIEW ==================== -->
    <div class="view-full" id="view-import">
        <div class="import-container">
            <h2>Import PGN</h2>

            <div class="form-group">
                <label for="import-name">Repertoire Name</label>
                <input type="text" id="import-name" placeholder="e.g. Sicilian Najdorf (White)">
            </div>

            <div class="form-group">
                <label for="import-color">I play as</label>
                <select id="import-color">
                    <option value="white">White</option>
                    <option value="black">Black</option>
                </select>
            </div>

            <div class="form-group">
                <label for="pgn-file">PGN File</label>
                <input type="file" id="pgn-file" accept=".pgn,.txt">
            </div>

            <div class="form-group">
                <div class="or-divider">- or paste PGN text -</div>
                <textarea id="pgn-text" placeholder="1. e4 e5 2. Nf3 Nc6 3. Bb5 (3. Bc4 Bc5) a6 4. Ba4 ..."></textarea>
            </div>

            <div id="import-language-info"></div>

            <div id="import-progress" style="display:none">
                <div class="progress-bar-container">
                    <div class="progress-bar" style="width: 0%"></div>
                </div>
            </div>
            <div id="import-status"></div>
            <div id="import-stats" class="import-stats" style="display:none"></div>

            <div class="import-actions">
                <button class="btn btn-primary" id="btn-do-import">Import</button>
                <button class="btn btn-secondary" id="btn-cancel-import">Cancel</button>
            </div>
        </div>
    </div>

    <!-- ==================== SHARED WORKSPACE (Explorer + Trainer) ==================== -->
    <div class="workspace" id="workspace" style="display:none">

        <!-- Left: Board -->
        <div class="workspace-board">
            <div class="workspace-title" id="workspace-title"></div>
            <div id="board" style="width: 100%"></div>

            <!-- Explorer controls -->
            <div class="board-controls" id="explorer-controls" style="display:none">
                <button class="btn btn-sm btn-secondary" id="btn-explorer-back" title="Undo (Left Arrow)">&#8592; Back</button>
                <button class="btn btn-sm btn-secondary" id="btn-explorer-reset">Reset</button>
                <button class="btn btn-sm btn-secondary" id="btn-explorer-flip" title="Flip board (F)">Flip</button>
                <button class="btn btn-sm btn-primary" id="btn-explorer-train">Train</button>
                <button class="btn btn-sm btn-secondary" id="btn-explorer-home">Home</button>
            </div>

            <!-- Trainer controls -->
            <div class="board-controls" id="trainer-controls" style="display:none">
                <button class="btn btn-sm btn-secondary" id="btn-trainer-skip">Skip</button>
                <button class="btn btn-sm btn-secondary" id="btn-trainer-flip" title="Flip board (F)">Flip</button>
                <button class="btn btn-sm btn-secondary" id="btn-hints" title="Show hints (H)">Hints</button>
                <button class="btn btn-sm btn-secondary" id="btn-trainer-restart">Restart</button>
                <button class="btn btn-sm btn-secondary" id="btn-trainer-home">Home</button>
            </div>
        </div>

        <!-- Right: Context Panel -->
        <div class="workspace-panel">

            <!-- Explorer Panel -->
            <div class="panel" id="explorer-panel" style="display:none">
                <div class="panel-header">
                    <h3>Explorer</h3>
                    <div id="explorer-stats" class="stats-row"></div>
                </div>
                <div class="panel-body">
                    <div id="explorer-moves" class="move-list"></div>
                    <h4 class="section-label">Continuations</h4>
                    <div id="explorer-children"></div>
                    <div id="explorer-comment" class="comment-box"></div>
                    <div id="explorer-transposition"></div>
                </div>
            </div>

            <!-- Trainer Panel -->
            <div class="panel" id="trainer-panel" style="display:none">
                <div class="panel-header">
                    <h3>Training</h3>
                </div>
                <div class="panel-body">
                    <div class="trainer-settings">
                        <div class="setting-group">
                            <label for="train-mode">Mode</label>
                            <select id="train-mode">
                                <option value="mix">Mix (Review + New)</option>
                                <option value="review">Review Due</option>
                                <option value="new">New Lines Only</option>
                                <option value="all">All Lines</option>
                            </select>
                        </div>
                        <div class="setting-group">
                            <label for="train-limit">Lines</label>
                            <input type="number" id="train-limit" value="20" min="1" max="500">
                        </div>
                    </div>
                    <div id="trainer-progress"></div>
                    <div id="trainer-moves" class="move-list"></div>
                    <div id="trainer-feedback"></div>
                </div>
            </div>
        </div>
    </div>

</main>

<!-- App scripts (order matters) -->
<script src="js/move-tree.js"></script>
<script src="js/pgn-parser.js"></script>
<script src="js/db.js"></script>
<script src="js/trainer.js"></script>
<script src="js/sounds.js"></script>
<script src="js/app.js"></script>

</body>
</html>
