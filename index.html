<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Chess Opening Repertoire Trainer</title>

    <!-- Vendor libraries (local) -->
    <script src="vendor/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="vendor/chessboard-1.0.0.min.css">
    <script src="vendor/chessboard-1.0.0.min.js"></script>
    <script src="vendor/chess.min.js"></script>

    <!-- App styles -->
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ==================== HEADER ==================== -->
<header class="app-header">
    <button class="btn btn-icon sidebar-toggle" id="btn-sidebar-toggle" title="Menu" aria-label="Open menu">&#9776;</button>
    <div class="app-title" id="btn-home" role="button" tabindex="0" title="Home">
        <span class="icon">&#9822;</span>
        <span class="app-title-text">Repertoire Trainer</span>
    </div>
    <div class="header-spacer"></div>
    <div class="header-actions">
        <button class="btn btn-icon" id="btn-shortcuts" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
        <button class="btn btn-icon btn-sound" id="btn-sound" title="Toggle sounds (M)" aria-label="Toggle sounds">&#9835;</button>
        <button class="btn btn-icon" id="btn-backup" title="Download a backup of all data" aria-label="Backup">&#128190;</button>
    </div>
</header>

<!-- ==================== APP LAYOUT ==================== -->
<div class="app-layout">

    <!-- Sidebar overlay for mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ==================== SIDEBAR ==================== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">Repertoires</div>
        <div class="sidebar-list" id="sidebar-list">
            <!-- Dynamically populated -->
        </div>
        <div class="sidebar-actions">
            <button class="btn btn-sm btn-primary sidebar-btn" id="btn-new-repertoire">+ New Repertoire</button>
            <button class="btn btn-sm btn-secondary sidebar-btn" id="btn-import">Import PGN</button>
            <button class="btn btn-sm btn-secondary sidebar-btn" id="btn-sandbox">&#9823; Sandbox Board</button>
            <label class="btn btn-sm btn-secondary sidebar-btn" style="cursor:pointer">
                &#128194; Restore Backup
                <input type="file" id="restore-file" accept=".json" style="display:none">
            </label>
        </div>
    </aside>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main class="main-content">

        <!-- WELCOME VIEW -->
        <div class="view-panel active" id="view-welcome">
            <div class="welcome-screen">
                <div id="welcome-content"><!-- rendered by app --></div>
                <div id="restore-status" style="display:none"></div>
                <div id="storage-status"></div>
            </div>
        </div>

        <!-- IMPORT VIEW -->
        <div class="view-panel" id="view-import">
            <div class="import-container">
                <h2>Import PGN</h2>

                <div class="form-group">
                    <label for="import-name">Repertoire Name</label>
                    <input type="text" id="import-name" placeholder="e.g. Sicilian Najdorf (Black)">
                </div>

                <div class="form-group">
                    <label for="import-color">I play as</label>
                    <select id="import-color">
                        <option value="white">White</option>
                        <option value="black">Black</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pgn-file">PGN File</label>
                    <input type="file" id="pgn-file" accept=".pgn,.txt">
                </div>

                <div class="form-group">
                    <div class="or-divider">- or paste PGN text -</div>
                    <textarea id="pgn-text" placeholder="1. e4 e5 2. Nf3 Nc6 3. Bb5 (3. Bc4 Bc5) a6 4. Ba4 ..."></textarea>
                </div>

                <div id="import-language-info"></div>

                <div id="import-progress" style="display:none">
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: 0%"></div>
                    </div>
                </div>
                <div id="import-status"></div>
                <div id="import-stats" class="import-stats" style="display:none"></div>

                <div class="import-actions">
                    <button class="btn btn-primary" id="btn-do-import">Import</button>
                    <button class="btn btn-secondary" id="btn-cancel-import">Cancel</button>
                </div>
            </div>
        </div>

        <!-- WORKSPACE (Board + Panel) -->
        <div class="view-panel" id="workspace" style="display:none">

            <!-- Tab Bar -->
            <div class="workspace-tabs">
                <div class="workspace-title" id="workspace-title"></div>
                <button class="tab-btn active" id="tab-train" data-tab="trainer">Train</button>
                <button class="tab-btn" id="tab-explore" data-tab="explorer">Explore</button>
                <button class="tab-btn" id="tab-sandbox" data-tab="sandbox" style="display:none">Sandbox</button>
            </div>

            <div class="workspace-grid">

                <!-- Left: Board -->
                <div class="workspace-board">
                    <div class="board-frame">
                        <div class="eval-gauge" id="eval-gauge" hidden title="Engine evaluation">
                            <div class="eval-gauge-fill" id="eval-gauge-fill"></div>
                            <span class="eval-gauge-label" id="eval-gauge-label"></span>
                        </div>
                        <div id="board"></div>
                    </div>

                    <!-- Explorer controls -->
                    <div class="board-controls" id="explorer-controls" style="display:none">
                        <button class="btn btn-sm btn-secondary" id="btn-explorer-start" title="Start position (Home)" aria-label="Start">&#9198;</button>
                        <button class="btn btn-sm btn-secondary" id="btn-explorer-back" title="Back (Left Arrow)" aria-label="Back">&#9664;</button>
                        <button class="btn btn-sm btn-secondary" id="btn-explorer-forward" title="Forward / mainline (Right Arrow)" aria-label="Forward">&#9654;</button>
                        <button class="btn btn-sm btn-secondary" id="btn-explorer-end" title="End of mainline (End)" aria-label="End">&#9197;</button>
                        <span class="controls-spacer"></span>
                        <button class="btn btn-sm btn-secondary" id="btn-explorer-flip" title="Flip board (F)">Flip</button>
                    </div>

                    <!-- Sandbox controls -->
                    <div class="board-controls" id="sandbox-controls" style="display:none">
                        <button class="btn btn-sm btn-secondary" id="btn-sandbox-back" title="Undo (Left Arrow)" aria-label="Undo">&#9664; Undo</button>
                        <button class="btn btn-sm btn-secondary" id="btn-sandbox-forward" title="Redo (Right Arrow)" aria-label="Redo">Redo &#9654;</button>
                        <button class="btn btn-sm btn-secondary" id="btn-sandbox-reset">Reset</button>
                        <span class="controls-spacer"></span>
                        <button class="btn btn-sm btn-secondary" id="btn-sandbox-flip" title="Flip board (F)">Flip</button>
                    </div>

                    <!-- Trainer controls -->
                    <div class="board-controls" id="trainer-controls" style="display:none">
                        <button class="btn btn-sm btn-secondary" id="btn-hint" title="Highlight the piece to move (H)">&#128161; Hint</button>
                        <button class="btn btn-sm btn-secondary" id="btn-show-move" title="Show the move with an arrow (S)">&#128065; Show move</button>
                        <button class="btn btn-sm btn-secondary" id="btn-trainer-skip" title="Skip this line">Skip</button>
                        <span class="controls-spacer"></span>
                        <button class="btn btn-sm btn-secondary" id="btn-trainer-flip" title="Flip board (F)">Flip</button>
                        <button class="btn btn-sm btn-secondary" id="btn-trainer-restart" title="Restart the session">Restart</button>
                    </div>
                </div>

                <!-- Right: Context Panel -->
                <div class="workspace-panel-area">

                    <!-- Engine (shared by Explorer and Sandbox) -->
                    <div class="panel engine-panel" id="engine-panel" style="display:none">
                        <div class="engine-head">
                            <label class="switch" title="Toggle engine (E)">
                                <input type="checkbox" id="engine-toggle" aria-label="Engine analysis">
                                <span class="slider"></span>
                            </label>
                            <span class="engine-name" id="engine-name-label">Stockfish 18</span>
                            <span class="engine-depth" id="engine-depth"></span>
                            <span class="engine-score" id="engine-score"></span>
                        </div>
                        <div class="engine-lines" id="engine-lines"></div>
                    </div>

                    <!-- Explorer Panel -->
                    <div class="panel" id="explorer-panel" style="display:none">
                        <div class="panel-header">
                            <h3>Explorer</h3>
                            <div id="explorer-stats" class="stats-row"></div>
                        </div>
                        <div class="panel-body">
                            <div id="explorer-opening" class="opening-label"></div>
                            <div id="explorer-moves" class="move-list"></div>

                            <div class="explorer-toolbar">
                                <button class="btn btn-sm" id="btn-edit-mode" aria-pressed="false" title="When on, moves you play are added to the repertoire">&#9998; Edit mode</button>
                                <button class="btn btn-sm" id="btn-train-here" title="Train only the lines that continue from this position">&#9654; Train from here</button>
                            </div>
                            <div id="edit-banner" class="edit-banner" hidden>
                                Edit mode is on — moves you play on the board are added to this repertoire.
                            </div>

                            <h4 class="section-label" id="explorer-children-label">Repertoire moves</h4>
                            <div id="explorer-children"></div>
                            <div id="explorer-transposition"></div>

                            <!-- Notes & move quality for the move that led here -->
                            <div class="notes" id="notes-section" hidden>
                                <h4 class="section-label">Notes on <span id="notes-move" class="san-label"></span></h4>
                                <div class="nag-buttons" id="nag-buttons" role="group" aria-label="Move quality"></div>
                                <textarea id="note-text" rows="3" placeholder="Why this move? Plans, traps, typical ideas…"></textarea>
                                <div class="note-status" id="note-status" aria-live="polite"></div>
                            </div>

                            <!-- Repertoire Tree View -->
                            <h4 class="section-label tree-label">
                                Repertoire Tree
                                <button class="btn btn-sm btn-icon" id="btn-tree-collapse-all" title="Collapse all">&#9660;</button>
                                <button class="btn btn-sm btn-icon" id="btn-tree-expand-all" title="Expand all">&#9654;</button>
                            </h4>
                            <div id="explorer-tree-view" class="tree-view-container"></div>
                        </div>
                    </div>

                    <!-- Sandbox Panel -->
                    <div class="panel" id="sandbox-panel" style="display:none">
                        <div class="panel-header">
                            <h3>Sandbox</h3>
                            <div class="stats-row"><span class="text-muted" style="font-size:0.78rem">Free practice — no repertoire</span></div>
                        </div>
                        <div class="panel-body">
                            <div id="sandbox-opening" class="opening-label"></div>

                            <h4 class="section-label">Moves</h4>
                            <div id="sandbox-moves" class="move-list"></div>

                            <h4 class="section-label">Position</h4>
                            <div class="sandbox-fen-row">
                                <input type="text" id="sandbox-fen-input" class="sandbox-fen-input" placeholder="Paste a FEN and press Enter…" spellcheck="false" aria-label="FEN">
                                <button class="btn btn-sm btn-secondary" id="btn-sandbox-load-fen">Load</button>
                            </div>
                            <div class="sandbox-actions">
                                <button class="btn btn-sm btn-secondary" id="btn-sandbox-copy-fen">&#128203; FEN</button>
                                <button class="btn btn-sm btn-secondary" id="btn-sandbox-copy-pgn">&#128203; PGN</button>
                                <button class="btn btn-sm btn-secondary" id="btn-sandbox-save-rep" title="Save this line into a repertoire">&#128190; Save line</button>
                            </div>
                        </div>
                    </div>

                    <!-- Trainer Panel -->
                    <div class="panel" id="trainer-panel" style="display:none">
                        <div class="panel-header">
                            <h3>Training</h3>
                            <div id="trainer-stats" class="stats-row"></div>
                        </div>
                        <div class="panel-body">
                            <div class="trainer-settings">
                                <div class="setting-group">
                                    <label for="train-mode">Mode</label>
                                    <select id="train-mode">
                                        <option value="mix">Due + new</option>
                                        <option value="review">Due only</option>
                                        <option value="new">New only</option>
                                        <option value="all">All lines</option>
                                    </select>
                                </div>
                                <div class="setting-group">
                                    <label for="train-limit">Lines</label>
                                    <input type="number" id="train-limit" value="20" min="1" max="500">
                                </div>
                                <label class="checkbox-setting" title="Show the moves of lines you have never seen before, then review them later">
                                    <input type="checkbox" id="train-learn" checked> Learn new lines first
                                </label>
                            </div>
                            <div id="trainer-progress"></div>
                            <div id="trainer-prompt" class="trainer-prompt"></div>
                            <div id="trainer-moves" class="move-list"></div>
                            <div id="trainer-comment" class="trainer-comment" hidden></div>
                            <div id="trainer-feedback"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>
</div>

<!-- App scripts (order matters) -->
<script src="js/move-tree.js"></script>
<script src="js/pgn-parser.js"></script>
<script src="js/db.js"></script>
<script src="js/trainer.js"></script>
<script src="js/sounds.js"></script>
<script src="js/pieces.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/board-overlay.js"></script>
<script src="js/eco.js"></script>
<script src="js/engine.js"></script>
<script src="js/sample-repertoires.js"></script>
<script src="js/app.js"></script>

</body>
</html>
